<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="description" content="Упражнения с анимацией, программы, режим тренировки и статистика. Работает без интернета.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymApp">
<meta name="format-detection" content="telephone=no">
<title>GymApp — тренировки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0c0e13;--surface:#141821;--surface2:#1a1f2b;--surface3:#232a3a;--line:#262c3b;--line2:#323a4d;
  --text:#eef1f7;--muted:#a0a8b9;--faint:#6b7488;
  --accent:#ff7a1a;--accent2:#ffa24d;--accent-soft:rgba(255,122,26,.14);--accent-ink:#1d0e02;
  --good:#34d399;--good-soft:rgba(52,211,153,.14);--danger:#f87171;--danger-soft:rgba(248,113,113,.13);
  --fig:#e3e8f1;--fig2:#5a6479;--eq:#8590a6;--eq2:#3b4357;--eq3:#2a3142;
  --stage1:#181d29;--stage2:#10131a;
  --shadow:0 12px 32px rgba(0,0,0,.38);--r:18px;--rs:12px;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f4f7;--surface:#ffffff;--surface2:#f5f6f9;--surface3:#eceef3;--line:#e3e6ec;--line2:#d5d9e1;
  --text:#161a23;--muted:#596173;--faint:#8b93a3;
  --accent:#f0640a;--accent2:#ff8a3d;--accent-soft:rgba(240,100,10,.1);--accent-ink:#ffffff;
  --good:#0f9f6e;--good-soft:rgba(15,159,110,.1);--danger:#dc3f3f;--danger-soft:rgba(220,63,63,.09);
  --fig:#262c3a;--fig2:#a9b0bf;--eq:#6c7588;--eq2:#c3c9d4;--eq3:#dde1e8;
  --stage1:#ffffff;--stage2:#f1f3f7;
  --shadow:0 10px 28px rgba(22,26,35,.08);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[data-act]{cursor:pointer}
.modal{cursor:auto}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.btn,.chip,.nav a,.wo-pill,.chk{touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.icon.sm{width:16px;height:16px}
.icon.lg{width:24px;height:24px}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#1d0e02;box-shadow:0 6px 18px rgba(255,122,26,.35)}
.brand-mark .icon{stroke-width:2.4}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:0;margin-top:-3px}
.top-actions{margin-left:auto;display:flex;gap:6px}
.nav{display:flex;gap:4px}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;color:var(--muted);font-weight:600;font-size:14px;transition:.15s}
.nav a:hover{color:var(--text);background:var(--surface2)}
.nav a.on{color:var(--text);background:var(--surface3)}
.nav a.on .icon{color:var(--accent)}
.nav .live{position:relative}
.nav .live::after{content:"";position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
main{max-width:1120px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 120px max(16px,env(safe-area-inset-left))}
@media (max-width:860px){
  .topbar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .wo-main .stage svg.fig[data-big]{max-height:30vh}
  .topbar .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-around;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;min-width:62px;border-radius:10px}
  .nav a.on{background:transparent}
  .nav .live::after{top:4px;right:16px}
  main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  .input,select.input,textarea.input,.mini-f input,.mini-f select,.num{font-size:16px}
}

/* ---------- generic ---------- */
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.2}
h1{font-size:28px;font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.page-head p{margin:4px 0 0;color:var(--muted)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card + .card{margin-top:14px}
.grid>.card+.card,.wo-main>.card+.card,.grid>*{margin-top:0}
h3{display:flex;align-items:center;gap:8px}
.stage svg.fig[data-big]{max-height:min(54vh,440px)}
.kv dd .dots{margin-right:6px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:14px}.mt2{margin-top:22px}.mb{margin-bottom:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;white-space:nowrap;user-select:none}
.btn:hover{background:var(--surface3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#1d0e02;box-shadow:0 8px 22px rgba(255,122,26,.28)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-soft)}
.btn.good{background:var(--good);color:#04130d;border-color:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn.icon-only{padding:9px;border-radius:11px}
.btn.icon-only.sm{padding:6px}
.btn[disabled]{opacity:.45;pointer-events:none}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.15s}
.chip:hover{color:var(--text)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;background:var(--surface3);color:var(--muted);font-size:12px;font-weight:600}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.good{background:var(--good-soft);color:var(--good)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.dots i.on{background:var(--accent)}

.input,select.input,textarea.input{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:80px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 6px}
.search{position:relative}
.search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .input{padding-left:40px}

/* ---------- stage (animation) ---------- */
.stage{position:relative;background:radial-gradient(120% 90% at 50% 0%,var(--stage1),var(--stage2));border-radius:14px;overflow:hidden}
.stage svg.fig{width:100%;height:auto}
.fig line{stroke-linecap:round}
.fig .n{stroke:var(--fig)}.fig .f{stroke:var(--fig2)}
.fig .m{stroke:var(--accent)}.fig .mf{stroke:var(--accent);opacity:.5}
.fig .cn{fill:var(--fig)}.fig .cf{fill:var(--fig2)}
.fig .cm{fill:var(--accent)}.fig .cmf{fill:var(--accent);opacity:.5}
.fig .tor{fill:var(--fig);stroke:var(--fig);stroke-linejoin:round}
.fig .eq{fill:var(--eq)}.fig .eqd{fill:var(--eq2)}.fig .eql{fill:var(--eq3)}
.fig .eqs{stroke:var(--eq);fill:none}.fig .eqs2{stroke:var(--eq2);fill:none}.fig .eqs3{stroke:var(--eq3);fill:none}
.fig .far{opacity:.55}
.fig .cab{stroke:var(--eq);stroke-width:1.4;fill:none}
.fig .floor{stroke:var(--line2);stroke-width:2}
.fig .arr{stroke:var(--accent);fill:none;stroke-width:2.2;opacity:.75}
.fig .arrh{fill:var(--accent);opacity:.75}
.stage .ph{display:grid;place-items:center;aspect-ratio:240/200;color:var(--faint)}
.stage .ph .icon{width:56px;height:56px;stroke-width:1.4}
.stage-ctl{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.stage-ctl .btn{background:color-mix(in srgb,var(--surface) 80%,transparent);backdrop-filter:blur(6px)}
.stage-badge{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}

/* ---------- exercise grid ---------- */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
@media (max-width:520px){.ex-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.ex-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;flex-direction:column}
.ex-card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:var(--shadow)}
.ex-card .stage{border-radius:12px}
.ex-card .body{padding:10px 4px 4px;display:flex;flex-direction:column;gap:6px;flex:1}
.ex-card .name{font-weight:700;font-size:14.5px;line-height:1.3}
.ex-card .meta{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px;margin-top:auto}
.ex-card .grp{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}

/* ---------- exercise detail ---------- */
.ex-detail{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.ex-detail{grid-template-columns:1fr}}
.sticky-col{position:sticky;top:84px}
@media (max-width:860px){.sticky-col{position:static}}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:grid;place-items:center}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.errs li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.errs li::before{content:"✕";color:var(--danger);font-weight:800;font-size:13px;padding-top:1px;text-align:center}
.tip{display:flex;gap:12px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 25%,transparent);border-radius:14px;padding:14px}
.tip .icon{color:var(--good);margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--faint);font-weight:600}.kv dd{margin:0;font-weight:600}

/* ---------- programs ---------- */
.prog-card{position:relative;overflow:hidden}
.prog-card .bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--accent))}
.prog-card h3{font-size:18px}
.prog-list{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:13.5px}
.prog-list .it{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}
.prog-list .it b{color:var(--text);font-weight:600}
.edit-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.edit-item + .edit-item{margin-top:8px}
.edit-item .stage{border-radius:10px}
.edit-item .nm{font-weight:700;font-size:14px}
.edit-fields{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.mini-f{display:flex;flex-direction:column;gap:2px}
.mini-f span{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.mini-f input,.mini-f select{width:70px;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:6px 8px;font-size:14px;font-weight:600;outline:none}
.mini-f input:focus{border-color:var(--accent)}
.mini-f.w input{width:92px}
.ord{display:flex;flex-direction:column;gap:4px}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 22%,var(--surface)) 0%,var(--surface) 60%);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 70%);pointer-events:none}
.hero .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{margin:6px 0 6px}
.hero-grid{display:grid;grid-template-columns:1fr 220px;gap:20px;align-items:center;position:relative;z-index:1}
@media (max-width:640px){.hero-grid{grid-template-columns:1fr}.hero-grid .stage{display:none}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .lb{font-size:12.5px;color:var(--faint);font-weight:700;display:flex;align-items:center;gap:6px}
.kpi .vl{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.kpi .vl small{font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.kpi .sub{font-size:12px;color:var(--faint);margin-top:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-radius:12px;background:var(--surface2);font-size:12px;color:var(--faint);font-weight:700}
.day b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--muted);border:1.5px dashed var(--line2)}
.day.done b{background:var(--accent);border-color:var(--accent);color:#1d0e02}
.day.today{outline:1.5px solid var(--line2)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.list-row:first-child{border-top:0;padding-top:0}
.list-row .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.list-row .tt{font-weight:700}
.list-row .st{font-size:12.5px;color:var(--faint)}
.empty{text-align:center;padding:30px 16px;color:var(--faint)}
.empty .icon{width:40px;height:40px;margin:0 auto 10px;stroke-width:1.5}

/* ---------- workout ---------- */
.wo-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wo-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;letter-spacing:-.02em}
.wo-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.wo-pill{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;max-width:230px}
.wo-pill .n{width:24px;height:24px;border-radius:8px;background:var(--surface3);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.wo-pill .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-pill .p{font-size:11px;color:var(--faint);font-weight:700}
.wo-pill.on{border-color:var(--accent);background:var(--accent-soft)}
.wo-pill.on .n{background:var(--accent);color:#1d0e02}
.wo-pill.done .n{background:var(--good);color:#04130d}
.wo-main{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:16px;align-items:start}
.wo-main{grid-template-areas:"a b" "c b"}.wo-main .wa{grid-area:a}.wo-main .wb{grid-area:b}.wo-main .wc{grid-area:c;background:var(--surface)}
@media (max-width:860px){.wo-main{grid-template-columns:1fr;grid-template-areas:"a" "b" "c"}}
.target{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.target .tag{font-size:13px;padding:5px 10px}
.sets{width:100%;border-collapse:separate;border-spacing:0 8px}
.sets th{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:0 6px}
.sets td{padding:0 4px}
.set-row td{background:var(--surface2);transition:background .2s}
.set-row td:first-child{border-radius:12px 0 0 12px;padding-left:10px}
.set-row td:last-child{border-radius:0 12px 12px 0;padding-right:8px}
.set-row.done td{background:var(--good-soft)}
.set-n{width:28px;height:28px;border-radius:9px;background:var(--surface3);display:grid;place-items:center;font-weight:800;font-size:13px}
.set-row.done .set-n{background:var(--good);color:#04130d}
.set-prev{font-size:12px;color:var(--faint);white-space:nowrap}
.num{width:100%;min-width:56px;max-width:96px;background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:9px 8px;text-align:center;font-weight:800;font-size:16px;outline:none;font-variant-numeric:tabular-nums}
.num:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.set-row.done .num{border-color:transparent;background:transparent}
.chk{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--faint);transition:.15s;margin:6px 0}
.chk:hover{border-color:var(--good);color:var(--good)}
.set-row.done .chk{background:var(--good);border-color:var(--good);color:#04130d}
.sw{font-variant-numeric:tabular-nums;font-weight:800}

<script>
'use strict';
/* =====================================================================
   1. ДВИЖОК АНИМАЦИИ — скелет, обратная кинематика, отрисовка в SVG
   ===================================================================== */
const D2R = Math.PI / 180, ANK = 172, FLOOR = 178, VBW = 240, VBH = 200;
const LEN = { tor: 50, neck: 5, head: 10, ua: 27, fa: 25, th: 40, sh: 40, foot: 11 };
const WD = { tor: 16, neck: 7, ua: 9, fa: 8, th: 12.5, sh: 10.5, foot: 6.5 };
const dir = a => [Math.sin(a * D2R), Math.cos(a * D2R)];
const add = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
const vlen = v => Math.hypot(v[0], v[1]);
const norm = v => { const l = vlen(v) || 1; return [v[0] / l, v[1] / l]; };
const mix = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = n => Math.round(n * 10) / 10;

function ik(R, T, a, b, bend) {
  const v = sub(T, R);
  const d = clamp(vlen(v), Math.abs(a - b) + 0.01, a + b - 0.01);
  const th = Math.atan2(v[1], v[0]);
  const al = Math.acos(clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1));
  const ang = th - bend * al;
  const M = [R[0] + a * Math.cos(ang), R[1] + a * Math.sin(ang)];
  return [M, add(M, norm(sub(T, M)), b)];
}
// конечность: массив [угол1, угол2, масштаб1, масштаб2] или {ik:[x,y], b:±1}
function limb(root, spec, a, b, defBend) {
  if (Array.isArray(spec)) {
    const s1 = spec[2] ?? 1, s2 = spec[3] ?? s1;
    const M = add(root, dir(spec[0]), a * s1);
    return [M, add(M, dir(spec[1]), b * s2)];
  }
  return ik(root, spec.ik, a, b, spec.b ?? defBend);
}
function lerpV(a, b, k) {
  if (typeof a === 'number') return typeof b === 'number' ? a + (b - a) * k : a;
  if (Array.isArray(a)) return a.map((v, i) => lerpV(v, b ? b[i] : v, k));
  if (a && typeof a === 'object') { const o = {}; for (const key in a) o[key] = b && key in b ? lerpV(a[key], b[key], k) : a[key]; return o; }
  return a;
}
const EASE = { io: k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, sine: k => -(Math.cos(Math.PI * k) - 1) / 2, lin: k => k };

function sampleAnim(an, t) {
  const F = an.frames, n = F.length;
  if (n === 1) return F[0];
  const dur = an.dur || (n === 2 ? [1100, 1500] : F.map(() => 700));
  const hold = an.hold ?? (n === 2 ? 380 : 0);
  const holds = Array.isArray(hold) ? hold : F.map(() => hold);
  let total = 0; for (let i = 0; i < n; i++) total += holds[i] + dur[i];
  let x = ((t % total) + total) % total;
  for (let i = 0; i < n; i++) {
    if (x < holds[i]) return F[i];
    x -= holds[i];
    if (x < dur[i]) { const k = dur[i] ? x / dur[i] : 1; return lerpV(F[i], F[(i + 1) % n], EASE[an.ease || 'io'](k)); }
    x -= dur[i];
  }
  return F[0];
}

/* ---------- решение позы: вид сбоку ---------- */
function solveSide(p) {
  const H = p.hip, td = dir(p.t), S = add(H, td, LEN.tor);
  const hdv = dir(p.t + (p.hd || 0));
  const N = add(S, hdv, LEN.neck), HC = add(S, hdv, LEN.neck + LEN.head);
  const [EN, WN] = limb(S, p.aN, LEN.ua, LEN.fa, -1);
  const [EF, WF] = limb(S, p.aF || p.aN, LEN.ua, LEN.fa, -1);
  const [KN, AN] = limb(H, p.lN, LEN.th, LEN.sh, 1);
  const [KF, AF] = limb(H, p.lF || p.lN, LEN.th, LEN.sh, 1);
  const J = { view: 'side', p, H, S, N, HC, td, front: [-td[1], td[0]], EN, WN, EF, WF, KN, AN, KF, AF };
  J.TN = footEnd(KN, AN, p.fN); J.TF = footEnd(KF, AF, p.fF ?? p.fN);
  return J;
}
function footEnd(K, A, f) {
  if (f != null) return add(A, dir(f), LEN.foot);
  if (A[1] > ANK - 8) return [A[0] + LEN.foot, A[1]];
  const d = norm(sub(A, K)); return add(A, [d[1], -d[0]], LEN.foot);
}

/* ---------- решение позы: вид спереди ---------- */
function solveFront(p) {
  const H = p.hip, phi = -((p.t ?? 180) - 180) * D2R, c = Math.cos(phi), s = Math.sin(phi);
  const R = v => [H[0] + v[0] * c - v[1] * s, H[1] + v[0] * s + v[1] * c];
  const sh = p.sh || 0, sw = p.sw ?? 15;
  const S = [0, -LEN.tor - sh];
  const SR = [sw, -LEN.tor + 2 - sh], SL = [-sw, -LEN.tor + 2 - sh];
  const HR = [9, 0], HL = [-9, 0];
  const N = [0, -LEN.tor - LEN.neck], HC = [0, -LEN.tor - LEN.neck - LEN.head + 1];
  const fl = (root, spec, a, b, side) => {
    const s1 = spec[2] ?? 1, s2 = spec[3] ?? s1;
    const d1 = [side * Math.sin(spec[0] * D2R), Math.cos(spec[0] * D2R)];
    const d2 = [side * Math.sin(spec[1] * D2R), Math.cos(spec[1] * D2R)];
    const M = add(root, d1, a * s1); return [M, add(M, d2, b * s2)];
  };
  const [ER, WR] = fl(SR, p.aR || p.a, LEN.ua, LEN.fa, 1);
  const [EL, WL] = fl(SL, p.aL || p.a, LEN.ua, LEN.fa, -1);
  const [KR, AR] = fl(HR, p.lR || p.l, LEN.th, LEN.sh, 1);
  const [KL, AL] = fl(HL, p.lL || p.l, LEN.th, LEN.sh, -1);
  const TR = add(AR, [5, 2.5]), TL = add(AL, [-5, 2.5]);
  const loc = { S, SR, SL, HR, HL, N, HC, ER, WR, EL, WL, KR, AR, KL, AL, TR, TL };
  const J = { view: 'front', p, H: [...H], up: R([0, -1]).map((v, i) => v - H[i]), right: R([1, 0]).map((v, i) => v - H[i]) };
  for (const k in loc) J[k] = R(loc[k]);
  return J;
}

/* ---------- примитивы SVG ---------- */
const sLine = (a, b, w, c) => `<line x1="${r1(a[0])}" y1="${r1(a[1])}" x2="${r1(b[0])}" y2="${r1(b[1])}" stroke-width="${w}" class="${c}"/>`;
const sCirc = (p, r, c) => `<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="${r}" class="${c}"/>`;
// мышечная «накладка» на сегмент: u0..u1 доля длины, side +1 перед / -1 зад / 0 центр
function ov(A, B, u0, u1, side, w, cls, frontVec) {
  const d = norm(sub(B, A));
  const n = frontVec || [d[1], -d[0]];
  const off = side * w * 0.24;
  const P = add(add(A, sub(B, A), u0), n, off), Q = add(add(A, sub(B, A), u1), n, off);
  return sLine(P, Q, r1(w * (side ? 0.5 : 0.62)), cls);
}

function drawSide(J, hl) {
  const h = k => hl.has(k);
  const tFront = J.front;
  let s = '';
  const arm = (S, E, W, c, m) => {
    let o = sLine(S, E, WD.ua, c) + sLine(E, W, WD.fa, c) + sCirc(W, 4.4, 'c' + c);
    if (h('biceps')) o += ov(S, E, .2, .8, 1, WD.ua, m);
    if (h('triceps')) o += ov(S, E, .2, .8, -1, WD.ua, m);
    if (h('forearms')) o += ov(E, W, .15, .75, 0, WD.fa, m);
    return o;
  };
  const leg = (H, K, A, T, c, m) => {
    let o = sLine(H, K, WD.th, c) + sLine(K, A, WD.sh, c) + sLine(A, T, WD.foot, c);
    if (h('quads')) o += ov(H, K, .18, .85, 1, WD.th, m);
    if (h('hams')) o += ov(H, K, .15, .85, -1, WD.th, m);
    if (h('calves')) o += ov(K, A, .12, .6, -1, WD.sh, m);
    return o;
  };
  s += arm(J.S, J.EF, J.WF, 'f', 'mf');
  s += leg(J.H, J.KF, J.AF, J.TF, 'f', 'mf');
  // корпус
  s += sLine(J.H, J.S, WD.tor, 'n') + sLine(J.S, J.N, WD.neck, 'n') + sCirc(J.HC, LEN.head, 'cn');
  const T = (u0, u1, side, cls = 'm') => ov(J.H, J.S, u0, u1, side, WD.tor, cls, tFront);
  if (h('abs')) s += T(.14, .55, 1);
  if (h('chest')) s += T(.6, .9, 1);
  if (h('lats')) s += T(.45, .88, -1);
  if (h('lowerback')) s += T(.1, .42, -1);
  if (h('traps') || h('upperback')) s += T(.8, 1.02, -1);
  if (h('glutes') || h('abd')) s += sCirc(add(J.H, tFront, -4), 6.2, 'cm');
  s += leg(J.H, J.KN, J.AN, J.TN, 'n', 'm');
  s += arm(J.S, J.EN, J.WN, 'n', 'm');
  if (h('delts')) s += sCirc(J.S, 6, 'cm');
  return s;
}

function drawFront(J, hl) {
  const h = k => hl.has(k);
  let s = '';
  const pts = [J.SR, J.SL, J.HL, J.HR].map(p => r1(p[0]) + ',' + r1(p[1])).join(' ');
  // ноги
  const leg = (H, K, A, T) => {
    let o = sLine(H, K, WD.th, 'n') + sLine(K, A, WD.sh, 'n') + sLine(A, T, WD.foot, 'n');
    if (h('quads') || h('hams')) o += ov(H, K, .15, .85, 0, WD.th, 'm');
    if (h('abd')) { const out = norm(sub(H, J.H)); o += ov(H, K, .05, .6, 1, WD.th, 'm', out); }
    if (h('calves')) o += ov(K, A, .1, .55, 0, WD.sh, 'm');
    return o;
  };
  s += leg(J.HR, J.KR, J.AR, J.TR) + leg(J.HL, J.KL, J.AL, J.TL);
  s += `<polygon points="${pts}" class="tor" stroke-width="7"/>`;
  s += sLine(J.S, J.N, WD.neck, 'n') + sCirc(J.HC, LEN.head, 'cn');
  const up = J.up, rt = J.right;
  const at = (base, u, r) => add(add(base, up, u), rt, r);
  if (h('chest')) { s += sCirc(at(J.H, 38, 6.5), 5.6, 'cm') + sCirc(at(J.H, 38, -6.5), 5.6, 'cm'); }
  if (h('abs')) s += sLine(at(J.H, 8, 0), at(J.H, 27, 0), 8, 'm');
  if (h('lats')) { s += sLine(at(J.H, 40, 12), at(J.H, 20, 9), 4.5, 'm') + sLine(at(J.H, 40, -12), at(J.H, 20, -9), 4.5, 'm'); }
  if (h('upperback')) s += sLine(at(J.H, 42, 0), at(J.H, 30, 0), 12, 'm');
  if (h('lowerback')) s += sLine(at(J.H, 6, 0), at(J.H, 16, 0), 8, 'm');
  if (h('traps')) { s += sLine(at(J.S, 0, 3), J.SR.map((v, i) => v * .55 + at(J.S, 0, 3)[i] * .45), 5, 'm') + sLine(at(J.S, 0, -3), J.SL.map((v, i) => v * .55 + at(J.S, 0, -3)[i] * .45), 5, 'm'); }
  if (h('glutes') || h('abd')) { s += sCirc(at(J.H, 1, 9), 5, 'cm') + sCirc(at(J.H, 1, -9), 5, 'cm'); }
  const arm = (S, E, W) => {
    let o = sLine(S, E, WD.ua, 'n') + sLine(E, W, WD.fa, 'n') + sCirc(W, 4.4, 'cn');
    if (h('biceps') || h('triceps')) o += ov(S, E, .2, .8, 0, WD.ua, 'm');
    if (h('forearms')) o += ov(E, W, .15, .75, 0, WD.fa, 'm');
    return o;
  };
  s += arm(J.SR, J.ER, J.WR) + arm(J.SL, J.EL, J.WL);
  if (h('delts')) s += sCirc(J.SR, 6, 'cm') + sCirc(J.SL, 6, 'cm');
  return s;
}

/* ---------- инвентарь ---------- */
const P = {
  line: (a, b, w = 4, c = 'eqs') => sLine(a, b, w, c),
  rect: (x, y, w, h, c = 'eqd', rx = 3) => `<rect x="${r1(x)}" y="${r1(y)}" width="${r1(w)}" height="${r1(h)}" rx="${rx}" class="${c}"/>`,
  circ: (p, r, c = 'eq') => sCirc(p, r, c),
  poly: (pts, c = 'eqd') => `<polygon points="${pts.map(p => r1(p[0]) + ',' + r1(p[1])).join(' ')}" class="${c}"/>`,
  db: (p, ang = 0, far = false, sc = 1) => `<g transform="translate(${r1(p[0])} ${r1(p[1])}) rotate(${r1(ang)}) scale(${sc})" class="${far ? 'far' : ''}"><rect x="-9" y="-1.9" width="18" height="3.8" rx="1.2" class="eq"/><rect x="-12" y="-7" width="5.5" height="14" rx="1.6" class="eq"/><rect x="6.5" y="-7" width="5.5" height="14" rx="1.6" class="eq"/></g>`,
  plate: (p, r = 17, far = false) => `<g class="${far ? 'far' : ''}">${sCirc(p, r, 'eqd')}${sCirc(p, r - 4, 'eql')}${sCirc(p, 3, 'eq')}</g>`,
  bench: (x1, x2, y, legs = true) => (legs ? sLine([x1 + 10, y + 6], [x1 + 10, FLOOR], 4, 'eqs') + sLine([x2 - 10, y + 6], [x2 - 10, FLOOR], 4, 'eqs') : '') + P.rect(x1, y, x2 - x1, 8, 'eqd', 4),
  cable: (a, b) => sLine(a, b, 1.4, 'cab'),
  pulley: p => sCirc(p, 5, 'eqd') + sCirc(p, 2, 'eq'),
  stack(x, lift, top = 60) {
    let o = sLine([x - 15, top], [x - 15, FLOOR], 3, 'eqs2') + sLine([x + 15, top], [x + 15, FLOOR], 3, 'eqs2') + P.rect(x - 18, top - 4, 36, 5, 'eq', 2);
    for (let i = 0; i < 8; i++) { const y = FLOOR - 7 * (i + 1) - (i >= 5 ? lift : 0); o += P.rect(x - 12, y, 24, 6, i >= 5 ? 'eq' : 'eqd', 1.5); }
    return o + sLine([x, FLOOR - 56 - lift], [x, top], 1.4, 'cab');
  },
  bar: (y, x1 = 60, x2 = 180) => sLine([x1, y], [x2, y], 4, 'eqs') + sLine([x1, y], [x1, FLOOR], 4, 'eqs2') + sLine([x2, y], [x2, FLOOR], 4, 'eqs2'),
  arrow(a, b) {
    const d = norm(sub(b, a)), n = [-d[1], d[0]], h1 = add(add(b, d, -6), n, 4), h2 = add(add(b, d, -6), n, -4);
    return sLine(a, add(b, d, -3), 2.2, 'arr') + `<polygon points="${r1(b[0])},${r1(b[1])} ${r1(h1[0])},${r1(h1[1])} ${r1(h2[0])},${r1(h2[1])}" class="arrh"/>`;
  }
};

function renderPose(an, t) {
  const p = sampleAnim(an, t);
  const J = p.view === 'front' ? solveFront(p) : solveSide(p);
  const hl = an._hl || (an._hl = new Set(an.hl || []));
  let s = an.noFloor ? '' : sLine([12, FLOOR], [228, FLOOR], 2, 'floor');
  if (an.bg) s += an.bg(J);
  s += J.view === 'front' ? drawFront(J, hl) : drawSide(J, hl);
  if (an.fg) s += an.fg(J);
  return s;
}

/* ---------- менеджер анимаций на странице ---------- */
const Anim = {
  list: [], last: 0, running: false,
  io: ('IntersectionObserver' in window) ? new IntersectionObserver(es => es.forEach(e => { e.target._vis = e.isIntersecting; }), { rootMargin: '80px' }) : null,
  scan(root = document) {
    this.list = this.list.filter(a => a.el.isConnected);
    root.querySelectorAll('svg.fig[data-ex]:not([data-on])').forEach(el => {
      const ex = exById(el.dataset.ex);
      if (!ex || !ex.anim) return;
      el.dataset.on = '1'; el._vis = !this.io;
      if (this.io) this.io.observe(el);
      const a = { el, an: ex.anim, t: Math.random() * 900 * (el.dataset.big ? 0 : 1), speed: 1, playing: true, big: !!el.dataset.big, acc: 99 };
      el._anim = a; this.list.push(a);
      el.innerHTML = renderPose(a.an, a.t);
    });
    if (!this.running) { this.running = true; this.last = performance.now(); requestAnimationFrame(this.tick.bind(this)); }
  },
  tick(now) {
    const dt = Math.min(64, now - this.last); this.last = now;
    for (const a of this.list) {
      if (!a.el.isConnected || !a.el._vis || !a.playing) continue;
      a.t += dt * a.speed; a.acc += dt;
      if (!a.big && a.acc < 33) continue; // миниатюры — 30 к/с
      a.acc = 0;
      a.el.innerHTML = renderPose(a.an, a.t);
    }
    requestAnimationFrame(this.tick.bind(this));
  }
};
function figSVG(exId, big = false) {
  const ex = exById(exId);
  if (!ex || !ex.anim) return `<div class="ph"><svg class="icon" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg></div>`;
  return `<svg class="fig" viewBox="0 0 ${VBW} ${VBH}" data-ex="${exId}"${big ? ' data-big="1"' : ''}></svg>`;
}

/* ---------- проверка схемы: и для импорта, и для localStorage ----------

const SAN = {
  arr: (v, max = 100000) => Array.isArray(v) ? v.slice(0, max) : [],
  obj: v => v && typeof v === 'object' && !Array.isArray(v),
  id: v => typeof v === 'string' && /^[\w-]{1,64}$/.test(v) ? v : null,
  str: (v, max = 300) => typeof v === 'string' ? v.slice(0, max) : typeof v === 'number' && Number.isFinite(v) ? String(v) : '',
  num: (v, min, max, def = 0) => { const n = typeof v === 'number' ? v : typeof v === 'string' && v.trim() !== '' ? Number(v) : NaN; return Number.isFinite(n) ? clamp(n, min, max) : def; },
  int: (v, min, max, def) => Math.round(SAN.num(v, min, max, def)),
  bool: (v, def) => typeof v === 'boolean' ? v : def,
  ts: v => SAN.num(v, 0, 8.64e15, 0),
  // значение в подходе: число или '' (ещё не введено — только в идущей тренировке)
  val: (v, max, allowEmpty) => allowEmpty && (v === '' || v == null) ? '' : SAN.num(v, 0, max, allowEmpty ? '' : 0)
};
function sanSet(s, live) {
  if (!SAN.obj(s)) return null;
  const o = {};
  for (const [k, max] of [['w', 2000], ['r', 10000], ['t', 86400]]) {
    if (live) o[k] = SAN.val(s[k], max, true);
    else if (s[k] != null && s[k] !== '') o[k] = SAN.num(s[k], 0, max);
  }
  if (live) { o.done = SAN.bool(s.done, false); if (s.ts != null) o.ts = SAN.ts(s.ts); }
  return o;
}
function sanProgram(p) {
  if (!SAN.obj(p)) return null;
  const items = SAN.arr(p.items, 200).map(i => {
    if (!SAN.obj(i) || !SAN.id(i.ex)) return null;
    return { ex: i.ex, sets: SAN.int(i.sets, 1, 50, 3), min: SAN.int(i.min, 0, 100000, 10), max: SAN.int(i.max, 0, 100000, 12), rest: SAN.int(i.rest, 0, 3600, 90), note: SAN.str(i.note, 200) };
  }).filter(Boolean);
  const o = { id: SAN.id(p.id) || uid(), name: SAN.str(p.name, 120) || 'Программа', desc: SAN.str(p.desc, 500), color: safeColor(p.color), items };
  if (SAN.id(p.pair)) o.pair = p.pair;
  if (p.builtin === true) o.builtin = true;
  return o;
}
function sanCustom(e) {
  if (!SAN.obj(e)) return null;
  const id = SAN.id(e.id), n = SAN.str(e.n, 120).trim();
  if (!id || !id.startsWith('c_') || !n) return null; // свои упражнения всегда c_…, чтобы не подменить встроенные
  const k = ['w', 'r', 't', 'c'].includes(e.k) ? e.k : 'w';
  const d = SAN.arr(e.d, 4), def = k === 't' ? [3, 20, 40, 60] : k === 'c' ? [1, 10, 20, 60] : [3, 10, 12, 90];
  const strs = (v, max) => SAN.arr(v, max).map(s => SAN.str(s, 500)).filter(Boolean);
  const steps = strs(e.steps, 30);
  return { id, custom: true, n, g: Object.prototype.hasOwnProperty.call(GROUPS, e.g) ? e.g : 'legs', k,
    d: [SAN.int(d[0], 1, 50, def[0]), SAN.int(d[1], 0, 100000, def[1]), SAN.int(d[2], 0, 100000, def[2]), SAN.int(d[3], 0, 3600, def[3])],
    lvl: SAN.int(e.lvl, 1, 3, 1), eq: strs(e.eq, 10).map(s => s.slice(0, 40)), m: SAN.str(e.m, 300) || '—',
    steps: steps.length ? steps : ['Описание не добавлено.'], err: strs(e.err, 30), tip: SAN.str(e.tip, 1000) };
}
function sanSession(s) {
  if (!SAN.obj(s) || !SAN.id(s.id)) return null;

  const items = SAN.arr(s.items, 200).map(i => SAN.obj(i) && SAN.id(i.ex) ? { ex: i.ex, sets: SAN.arr(i.sets, 100).map(x => sanSet(x, false)).filter(Boolean) } : null).filter(i => i && i.sets.length);
  if (!start || !items.length) return null;
  return { id: s.id, programId: SAN.id(s.programId), name: SAN.str(s.name, 120) || 'Тренировка', start, end: Math.max(start, SAN.ts(s.end)), items };
}
function sanActive(a) {

function sessDur(s) { return Math.max(0, (s.end - s.start) / 1000); }

}

  const a = DB.active;

    <div class="grid g2">${DB.programs.map(p => `<div class="card prog-card" style="--pc:${safeColor(p.color)}"><span class="bar"></span><div class="row"><div style="flex:1"><h3>${esc(p.name)}</h3><div class="faint" style="font-size:13px">${p.items.length} ${plural(p.items.length, 'упражнение', 'упражнения', 'упражнений')} · ≈ ${estMinutes(p)} мин${nextProgram() === p ? ' · <b style="color:var(--accent)">рекомендуем</b>' : ''}</div></div><button class="btn primary" data-act="start" data-id="${p.id}">${ic('play')} Начать</button></div></div>`).join('')}

  const cur = clamp(a.cur, 0, a.items.length - 1);

  const strip = a.items.map((i, n) => { const ex = exById(i.ex), d = i.sets.filter(s => s.done).length; return `<div class="wo-pill ${n === cur ? 'on' : ''} ${d && d >= i.sets.length ? 'done' : ''}" data-act="wo-go" data-n="${n}"><span class="n">${d && d >= i.sets.length ? ic('check', 'sm') : n + 1}</span><div style="min-width:0"><div class="t">${esc(ex ? ex.n : '?')}</div><div class="p">${d}/${i.sets.length} подх.</div></div></div>`; }).join('') +
    `<div class="wo-pill" data-act="pick-open" data-target="workout"><span class="n">${ic('plus', 'sm')}</span><div class="t">Добавить</div></div>`;
  const head = `<div class="wo-head"><div style="min-width:0"><div class="faint" style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em">Тренировка идёт</div><h2>${esc(a.name)}</h2></div><span class="sp"></span>
    <div class="row"><span class="wo-time" data-el="wo-time">${fmtDur((Date.now() - a.start) / 1000)}</span><button class="btn good" data-act="wo-finish">${ic('flag')} Завершить</button><button class="btn ghost icon-only" data-act="wo-cancel" title="Отменить тренировку">${ic('x')}</button></div></div>`;
  if (!item) return head + `<div class="wo-strip">${strip}</div><div class="empty card">${ic('db')}Добавь первое упражнение кнопкой «Добавить».</div>`;
  const ex = exById(item.ex);
  return head + `<div class="wo-strip">${strip}</div>
  <div class="wo-main mt">
    <div class="card wa">${stage(item.ex, true, ex.anim ? stageCtl() : '')}
      <div class="mt"><div class="faint" style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em">Упражнение ${cur + 1} из ${a.items.length}${item.note ? ' · ' + esc(item.note) : ''}</div><h2 style="margin-top:4px">${esc(ex.n)}</h2></div>
      <div class="target"><span class="tag acc">${ic('target', 'sm')} ${targetText({ sets: item.sets.length, min: item.min, max: item.max }, ex)}${ex.per ? ' ' + ex.per : ''}</span><span class="tag">${ic('timer', 'sm')} отдых ${restText(item.rest)}</span><span class="tag">${esc(ex.m)}</span></div>
    </div>
    <div class="card wb">${woSets(item, ex, cur)}</div>
    <details class="how wc" ${UI.howOpen ? 'open' : ''} data-act-toggle="how"><summary>${ic('book')} Техника выполнения ${ic('down', 'sm')}</summary><div class="in">${howBlock(ex)}</div></details>
  </div>`;
};
function woSets(item, ex, cur) {
  const hint = progressionHint(item, ex), lt = lastText(item.ex, ex), last = lastPerf(item.ex);
  const a = DB.active, sw = a.sw;
  const cols = ex.k === 'w' ? '<th>Вес, кг</th><th>Повторы</th>' : ex.k === 'r' ? '<th>Повторы</th><th>+ Вес, кг</th>' : ex.k === 't' ? '<th>Секунды</th><th>Таймер</th>' : '<th>Минуты</th><th>Таймер</th>';
  const rows = item.sets.map((s, j) => {
    const pv = last && last.sets[j] ? setShort(ex, last.sets[j]) : '—';
    const inp = (k, val, ph) => `<input class="num" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" data-wi="${cur}" data-wj="${j}" data-k="${k}" value="${val ?? ''}" placeholder="${ph}">`;
    let c1, c2;
    const repPh = (last && last.sets[j] && last.sets[j].r) || item.max;
    if (ex.k === 'w') { c1 = inp('w', s.w, (last && last.sets[j] && last.sets[j].w) || 0); c2 = inp('r', s.r, repPh); }
    else if (ex.k === 'r') { c1 = inp('r', s.r, repPh); c2 = inp('w', s.w, '0'); }
    else {
      const running = sw && sw.i === cur && sw.j === j;
      const v = ex.k === 'c' ? (s.t ? r1(s.t / 60) : '') : s.t;
      c1 = inp(ex.k === 'c' ? 'm' : 't', v, ex.k === 'c' ? item.max : item.max);
      c2 = `<button class="btn sm ${running ? 'primary' : ''}" data-act="sw" data-n="${j}" style="min-width:92px">${running ? `${ic('pause', 'sm')}<span class="sw" data-el="sw">${fmtDur((Date.now() - sw.start) / 1000)}</span>` : `${ic('play', 'sm')} Старт`}</button>`;
    }
    return `<tr class="set-row ${s.done ? 'done' : ''}"><td><span class="set-n">${j + 1}</span></td><td class="set-prev">${pv}</td><td>${c1}</td><td>${c2}</td><td><button class="chk" data-act="set-done" data-n="${j}" title="Подход выполнен">${ic('check')}</button></td></tr>`;
  }).join('');
  const allDone = item.sets.length && item.sets.every(s => s.done);
  const a2 = DB.active;
  return `${hint ? `<div class="hint mb">${ic('up')}<div>${hint.text}${hint.w ? ` <button class="btn sm primary" style="margin-top:8px" data-act="apply-w" data-w="${hint.w}">Поставить ${fmtN(hint.w)} кг</button>` : ''}</div></div>` : ''}
    <div class="row"><h3>${ic('layers')} Подходы</h3><span class="sp"></span>${lt ? `<span class="faint" style="font-size:12.5px">Прошлый раз: <b class="muted">${lt}</b></span>` : `<span class="faint" style="font-size:12.5px">Первый раз — начни с лёгкого веса</span>`}</div>
    <table class="sets"><thead><tr><th>#</th><th>Прошлый</th>${cols}<th></th></tr></thead><tbody>${rows}</tbody></table>
    <div class="row wrap"><button class="btn sm" data-act="set-add">${ic('plus', 'sm')} Подход</button>${item.sets.length > 1 ? `<button class="btn sm ghost" data-act="set-rm">${ic('minus', 'sm')} Убрать</button>` : ''}<span class="sp"></span>
      <button class="btn sm ghost" data-act="rest-start">${ic('timer', 'sm')} Отдых ${restText(item.rest)}</button><button class="btn sm ghost" data-act="wo-rm-ex" title="Убрать упражнение из тренировки">${ic('trash', 'sm')}</button></div>
    <div class="row mt2" style="gap:10px"><button class="btn" data-act="wo-go" data-n="${a2.cur - 1}" ${a2.cur === 0 ? 'disabled' : ''}>${ic('left')} Назад</button><span class="sp"></span>
      ${a2.cur < a2.items.length - 1 ? `<button class="btn ${allDone ? 'primary' : ''}" data-act="wo-go" data-n="${a2.cur + 1}">Следующее ${ic('right')}</button>` : `<button class="btn ${allDone ? 'good' : ''}" data-act="wo-finish">${ic('flag')} Завершить</button>`}</div>`;
}

function renderDock() {
  const el = $('#dock'), a = DB.active;
  if (!a) { el.innerHTML = ''; return; }

    const left = Math.max(0, (a.rest.end - Date.now()) / 1000), pct = clamp(left / a.rest.total, 0, 1), C = 2 * Math.PI * 24;
    el.innerHTML = `<div class="dock"><div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="var(--surface3)" stroke-width="5"/><circle data-el="ring" cx="28" cy="28" r="24" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg><span class="lbl" data-el="rest">${fmtDur(left)}</span></div>
      <div style="flex:1;min-width:0"><div class="ttl">Отдых</div><div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.rest.label || '')}</div></div>
      <button class="btn sm" data-act="rest-add" data-s="-15">−15</button><button class="btn sm" data-act="rest-add" data-s="15">+15</button><button class="btn sm primary icon-only" data-act="rest-skip" title="Пропустить">${ic('skip', 'sm')}</button></div>`;
  } else if (!onWo) {
    el.innerHTML = `<div class="dock mini" data-act="goto-wo"><div class="mini-ic">${ic('timer', 'lg')}</div><div style="flex:1;min-width:0"><div class="ttl">Тренировка идёт</div><div class="big" data-el="wo-time">${fmtDur((Date.now() - a.start) / 1000)}</div></div><span class="btn primary sm">${ic('play', 'sm')} Вернуться</span></div>`;
  } else el.innerHTML = '';
}

/* ---------- Статистика ---------- */
const CHARTS = {};
VIEWS.stats = () => {
  const now = Date.now(), R = UI.statRange;
  const first = DB.sessions.length ? Math.min(...DB.sessions.map(s => s.start)) : now;
  const nWeeks = R || clamp(Math.ceil((weekStart(now) - weekStart(first)) / (7 * 864e5)) + 1, 4, 52);
  const ws0 = weekStart(now) - (nWeeks - 1) * 7 * 864e5;
  const ss = DB.sessions.filter(s => s.start >= (R ? ws0 : 0));
  const vol = ss.reduce((a, s) => a + sessVolume(s), 0), time = ss.reduce((a, s) => a + sessDur(s), 0), sets = ss.reduce((a, s) => a + sessSets(s), 0);

  let exChart = '';

    const mets = sx.k === 'w' ? [['w', 'Макс. вес'], ['e', '1ПМ'], ['v', 'Объём']] : sx.k === 'r' ? [['r', 'Повторы'], ['v', 'Объём']] : [['t', sx.k === 'c' ? 'Минуты' : 'Секунды']];

      <div class="row faint" style="font-size:11px;margin-top:6px"><span>${fmtDate(hs)}</span><span class="sp"></span><span>сегодня</span></div></div>

/* ---------- отрисовка графиков (после вставки в DOM — знаем ширину) ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
function drawCharts() {
  $$('[data-chart]').forEach(el => {
    const c = CHARTS[el.dataset.chart]; if (!c) return;
    const W = Math.max(260, el.clientWidth), H = el.clientHeight || 180, L = 34, Rr = 8, T = 12, B = 24, pw = W - L - Rr, ph = H - T - B;
    const d = c.data; if (!d.length) { el.innerHTML = '<div class="empty">Нет данных</div>'; return; }
    let vmax = niceMax(Math.max(...d.map(x => x.v)) * (c.type === 'line' ? 1.1 : 1));
    if (c.int) vmax = Math.max(3, Math.ceil(Math.max(...d.map(x => x.v)) / 3) * 3);
    const vmin = c.type === 'line' ? Math.max(0, Math.floor(Math.min(...d.map(x => x.v)) * 0.8)) : 0;
    const y = v => T + ph - (v - vmin) / (vmax - vmin || 1) * ph;
    const fmt = c.fmt || (v => fmtN(v));
    let s = `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
    for (let i = 0; i <= 3; i++) { const v = vmin + (vmax - vmin) * i / 3, yy = y(v); s += `<line x1="${L}" x2="${W - Rr}" y1="${yy}" y2="${yy}" class="${i ? 'grid-l' : 'base-l'}"/><text x="${L - 6}" y="${yy + 3.5}" text-anchor="end">${c.int ? Math.round(v) : fmt(Math.round(v))}</text>`; }
    if (c.type === 'bar') {
      const n = d.length, slot = pw / n, bw = Math.min(28, slot * 0.62), step = Math.ceil(n / Math.floor(pw / 46));
      d.forEach((x, i) => {
        const cx = L + slot * i + slot / 2, yy = y(x.v), h = T + ph - yy;
        s += `<rect class="hit" x="${cx - slot / 2}" y="${T}" width="${slot}" height="${ph}" data-tip="${x.tip}"/>`;
        if (x.v > 0) s += `<path class="bar" data-tip="${x.tip}" d="M${cx - bw / 2},${T + ph} V${yy + Math.min(4, h)} q0,-4 4,-4 H${cx + bw / 2 - 4} q4,0 4,4 V${T + ph} Z"/>`;
        if (i % step === 0 || i === n - 1) s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${x.l}</text>`;
      });
    } else {
      const n = d.length, xs = i => n === 1 ? L + pw / 2 : L + pw * i / (n - 1);
      const pts = d.map((p, i) => [xs(i), y(p.v)]);
      if (n > 1) s += `<path class="area" d="M${pts[0][0]},${T + ph} ${pts.map(p => 'L' + p[0] + ',' + p[1]).join(' ')} L${pts[n - 1][0]},${T + ph} Z"/><path class="ln" d="M${pts.map(p => p[0] + ',' + p[1]).join(' L')}"/>`;
      const step = Math.ceil(n / Math.floor(pw / 70));
      pts.forEach((p, i) => {
        s += `<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4.5"/><circle class="hit" cx="${p[0]}" cy="${p[1]}" r="14" data-tip="${d[i].tip}"/>`;
        if (i % step === 0 || i === n - 1) s += `<text x="${p[0]}" y="${H - 6}" text-anchor="${n === 1 ? 'middle' : i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${new Date(d[i].ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '')}</text>`;
      });
      const best = d.reduce((m, p, i) => p.v > d[m].v ? i : m, 0);
      s += `<text class="vlab" x="${pts[best][0]}" y="${pts[best][1] - 10}" text-anchor="${best === 0 && n > 1 ? 'start' : best === n - 1 && n > 1 ? 'end' : 'middle'}">${fmtN(d[best].v)}</text>`;
    }
    el.innerHTML = s + '</svg>';
  });
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawCharts, 120); });

/* ---------- Настройки ---------- */
VIEWS.settings = () => {
  const st = DB.settings, tg = (k, l, d) => `<div class="list-row" data-act="set-tg" data-k="${k}"><div style="flex:1"><div class="tt">${l}</div><div class="st">${d}</div></div><span class="btn sm ${st[k] ? 'good' : ''}">${st[k] ? 'Вкл' : 'Выкл'}</span></div>`;
  return `<div class="page-head"><div><h1>Настройки</h1><p>Данные хранятся только в этом браузере на этом устройстве</p></div></div>
  <div class="grid g2"><div class="card"><div class="card-h"><h3>Оформление</h3></div><div class="seg">${[['dark', 'Тёмная'], ['light', 'Светлая'], ['auto', 'Как в системе']].map(([v, l]) => `<button class="${st.theme === v ? 'on' : ''}" data-act="set-theme" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="mt">${tg('autoRest', 'Автотаймер отдыха', 'Запускать отдых после отметки подхода')}${tg('sound', 'Звук', 'Сигнал в конце отдыха и таймера')}${tg('vibrate', 'Вибрация', 'На телефонах, которые это поддерживают')}</div></div>
  <div class="card"><div class="card-h"><h3>Данные</h3></div><p class="muted" style="margin-top:0;font-size:14px">Сделай резервную копию, чтобы перенести тренировки на другое устройство или не потерять их при очистке браузера.</p>
    <div class="row wrap"><button class="btn" data-act="export">${ic('download')} Экспорт</button><button class="btn" data-act="import">${ic('upload')} Импорт</button></div>
    <div class="row wrap mt"><button class="btn ghost" data-act="reset-progs">${ic('refresh')} Вернуть готовые программы</button><button class="btn danger" data-act="wipe">${ic('trash')} Удалить все данные</button></div></div>${installCard()}</div>`;
};

/* =====================================================================
   5. ДЕЙСТВИЯ, ТРЕНИРОВКА, ТАЙМЕРЫ
   ===================================================================== */
let AC = null;
function beep(pattern = [0, 0.18, 0.36]) {
  if (DB.settings.sound) try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    pattern.forEach((t, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = i === pattern.length - 1 ? 1175 : 880; g.gain.setValueAtTime(0.0001, AC.currentTime + t); g.gain.exponentialRampToValueAtTime(0.35, AC.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + t + 0.16); o.connect(g).connect(AC.destination); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + 0.2); });
  } catch (e) { }
  if (DB.settings.vibrate && navigator.vibrate) navigator.vibrate([180, 80, 180]);
}
let wakeLock = null;
async function keepAwake(on) {
  try { if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) { }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && DB.active) keepAwake(true); });

function makeItem(ex, sets, min, max, rest, note = '') {
  const last = lastPerf(ex.id);
  const S = Array.from({ length: sets }, (_, j) => {
    const p = last && (last.sets[j] || last.sets[last.sets.length - 1]);
    return { w: ex.k === 'w' && p && +p.w ? +p.w : '', r: '', t: '', done: false };
  });
  return { ex: ex.id, min, max, rest, note, sets: S };
}
function startWorkout(pid, extraEx) {
  const go2 = () => {
    const p = pid ? progById(pid) : null;
    const items = [];
    if (p) for (const i of p.items) { const ex = exById(i.ex); if (ex) items.push(makeItem(ex, i.sets, i.min, i.max, i.rest, i.note)); }
    if (extraEx) { const ex = exById(extraEx); items.push(makeItem(ex, ex.d[0], ex.d[1], ex.d[2], ex.d[3])); }
    DB.active = { id: uid(), programId: p ? p.id : null, name: p ? p.name : (extraEx ? 'Тренировка' : 'Свободная тренировка'), start: Date.now(), items, cur: 0, rest: null, sw: null };
    save(); keepAwake(true); closeModal(); go('#/workout');
    beep([0]);
  };
  if (DB.active) confirmBox('Уже идёт тренировка «' + esc(DB.active.name) + '». Начать новую? Текущая будет потеряна.', 'Начать новую', go2);
  else go2();
}
function curItem() { const a = DB.active; return a && a.items[a.cur]; }
function startRest(sec, label) {
  const a = DB.active; if (!a || !sec) return;
  a.rest = { end: Date.now() + sec * 1000, total: sec, label }; save(); renderDock();
}
function nextSetLabel() {
  const a = DB.active, it = curItem(); if (!it) return '';
  const j = it.sets.findIndex(s => !s.done);
  if (j >= 0) return `Дальше: подход ${j + 1} · ${exById(it.ex).n}`;
  const nx = a.items[a.cur + 1]; return nx ? `Дальше: ${exById(nx.ex).n}` : 'Последний подход позади — можно завершать!';
}
function completeSet(j) {
  const a = DB.active, it = curItem(), ex = exById(it.ex), s = it.sets[j];
  if (s.done) { s.done = false; save(); render(); return; }
  if (ex.k === 'w') { if (s.r === '') { const l = lastPerf(ex.id); s.r = (l && l.sets[j] && l.sets[j].r) || it.max; } if (s.w === '') s.w = 0; }
  if (ex.k === 'r' && s.r === '') { const l = lastPerf(ex.id); s.r = (l && l.sets[j] && l.sets[j].r) || it.max; }
  if ((ex.k === 't' || ex.k === 'c') && !s.t) {
    if (a.sw && a.sw.j === j && a.sw.i === a.cur) { s.t = Math.round((Date.now() - a.sw.start) / 1000); a.sw = null; }
    else s.t = ex.k === 'c' ? it.max * 60 : it.max;
  }
  s.done = true; s.ts = Date.now();
  const allDone = it.sets.every(x => x.done);
  const lastOverall = allDone && a.cur === a.items.length - 1;
  if (DB.settings.autoRest && !lastOverall) startRest(it.rest, nextSetLabel());
  save(); render();
  if (allDone) toast(lastOverall ? 'Все упражнения выполнены — отличная работа! 💪' : 'Упражнение выполнено ✓');
}
function toggleSW(j) {
  const a = DB.active, it = curItem(), ex = exById(it.ex);
  if (a.sw && a.sw.i === a.cur && a.sw.j === j) {
    it.sets[j].t = Math.round((Date.now() - a.sw.start) / 1000); a.sw = null; it.sets[j].done = false;
    completeSet(j); return;
  }
  a.sw = { i: a.cur, j, start: Date.now(), target: ex.k === 'c' ? it.max * 60 : it.max, beeped: false };
  a.rest = null; it.sets[j].done = false; save(); render();
}
function finishWorkout() {
  const a = DB.active;
  const items = a.items.map(i => ({ ex: i.ex, sets: i.sets.filter(s => s.done).map(s => { const o = {}; ['w', 'r', 't'].forEach(k => { if (s[k] !== '' && s[k] != null) o[k] = +s[k]; }); return o; }) })).filter(i => i.sets.length);
  if (!items.length) { confirmBox('Не отмечено ни одного подхода. Завершить без сохранения?', 'Завершить', () => { DB.active = null; save(); keepAwake(false); closeModal(); go('#/home'); }); return; }
  const sess = { id: a.id, programId: a.programId, name: a.name, start: a.start, end: Date.now(), items };
  const prs = [];
  for (const i of items) {
    const ex = exById(i.ex); if (!ex) continue; const b = bestOf(i.ex);
    if (ex.k === 'w') { const mw = Math.max(...i.sets.map(s => s.w || 0)); if (mw > 0 && (!b || mw > b.maxW)) prs.push(`${ex.n}: ${fmtN(mw)} кг`); }
    if (ex.k === 't') { const mt = Math.max(...i.sets.map(s => s.t || 0)); if (b && mt > b.maxT) prs.push(`${ex.n}: ${mt} сек`); }
    if (ex.k === 'r') { const mr = Math.max(...i.sets.map(s => s.r || 0)); if (b && mr > b.maxR) prs.push(`${ex.n}: ${mr} повт.`); }
  }
  DB.sessions.push(sess); DB.active = null; save(true); keepAwake(false);
  go('#/stats');
  const vol = sessVolume(sess), ns = sessSets(sess);
  setTimeout(() => openModal(`<div class="modal-b" style="padding-top:24px"><div class="confetti">🏆</div><h2 style="text-align:center">Тренировка завершена!</h2><p class="muted" style="text-align:center;margin:6px 0 18px">${esc(sess.name)} · ${fmtDate(sess.start)}</p>
    <div class="sum-big"><div><span>Время</span><b>${fmtDur(sessDur(sess))}</b></div><div><span>Подходов</span><b>${ns}</b></div><div><span>Упражнений</span><b>${items.length}</b></div><div><span>Тоннаж</span><b>${fmtKg(vol)}</b></div></div>
    ${prs.length ? `<div class="hint mt">${ic('trophy')}<div><b>Новые рекорды!</b><br>${prs.map(esc).join('<br>')}</div></div>` : ''}
    <div class="tip mt">${ic('bulb')}<div>Следующая тренировка — минимум через 2 дня отдыха. Мышцы растут во время восстановления.</div></div></div>
    <div class="modal-f"><button class="btn primary block" data-act="close">Отлично!</button></div>`), 80);
}
function sessModal(id) {
  const s = DB.sessions.find(x => x.id === id); if (!s) return;
  openModal(`${mHead(esc(s.name))}<div class="modal-b"><div class="row wrap mb" style="gap:6px"><span class="tag">${ic('clock', 'sm')} ${fmtDateW(s.start)}, ${new Date(s.start).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span><span class="tag">${ic('timer', 'sm')} ${fmtDur(sessDur(s), true)}</span><span class="tag">${ic('layers', 'sm')} ${sessSets(s)} подх.</span>${sessVolume(s) ? `<span class="tag">${ic('db', 'sm')} ${fmtKg(sessVolume(s))}</span>` : ''}</div>
    ${s.items.map(i => { const ex = exById(i.ex); return `<div class="sess-ex"><a href="#/ex/${i.ex}" style="font-weight:700">${esc(ex ? ex.n : i.ex)}</a><div class="sess-sets">${i.sets.map(st => `<span>${ex ? setShort(ex, st) : ''}</span>`).join('')}</div></div>`; }).join('')}</div>
    <div class="modal-f"><button class="btn danger" data-act="sess-del" data-id="${s.id}">${ic('trash')} Удалить</button><span class="sp"></span><button class="btn" data-act="close">Закрыть</button></div>`);
}
function addToProgModal(exId) {
  const ex = exById(exId);
  openModal(`${mHead('Добавить в программу')}<div class="modal-b"><p class="muted" style="margin-top:0">${esc(ex.n)} · ${ex.d[0]} × ${range(ex.d[1], ex.d[2])}</p>
    ${DB.programs.map(p => `<div class="list-row" data-act="atp" data-id="${p.id}" data-ex="${exId}"><div class="ic" style="background:color-mix(in srgb,${safeColor(p.color)} 14%,transparent);color:${safeColor(p.color)}">${ic('prog')}</div><div style="flex:1"><div class="tt">${esc(p.name)}</div><div class="st">${p.items.length} упр.${p.items.some(i => i.ex === exId) ? ' · уже есть' : ''}</div></div>${ic('plus')}</div>`).join('')}
    <div class="list-row" data-act="atp" data-id="__new" data-ex="${exId}"><div class="ic">${ic('plus')}</div><div class="tt">Новая программа</div></div></div>`);
}
function customModal() {
  openModal(`${mHead('Своё упражнение')}<div class="modal-b">
    <label class="f" style="margin-top:0">Название</label><input class="input" id="cx-n" placeholder="Например: Жим Арнольда">
    <div class="grid g2" style="gap:10px"><div><label class="f">Группа мышц</label><select class="input" id="cx-g">${Object.entries(GROUPS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
    <div><label class="f">Тип</label><select class="input" id="cx-k"><option value="w">Вес × повторы</option><option value="r">Повторы</option><option value="t">На время (сек)</option><option value="c">Кардио (мин)</option></select></div></div>
    <label class="f">Инвентарь</label><input class="input" id="cx-e" placeholder="Гантели, Скамья">
    <label class="f">Мышцы</label><input class="input" id="cx-m" placeholder="Плечи, трицепс">
    <label class="f">Как выполнять (каждый шаг с новой строки)</label><textarea class="input" id="cx-s"></textarea>
    <label class="f">Совет</label><input class="input" id="cx-t"></div>
    <div class="modal-f"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="custom-save">Сохранить</button></div>`);
}

/* ---------- обработчики ---------- */
const ACT = {
  close: closeModal,
  'modal-bg': (el, e) => { if (e.target === el) closeModal(); },
  'confirm-ok': () => { const f = UI.onConfirm; closeModal(); f && f(); },
  theme: () => { DB.settings.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; applyTheme(); save(); render(); },
  start: el => startWorkout(el.dataset.id || null),
  'quick-start': el => startWorkout(null, el.dataset.id),
  'goto-wo': () => go('#/workout'),
  // упражнения
  'ex-g': el => { UI.exG = el.dataset.g; render(); },
  'anim-toggle': el => { const s = el.closest('.stage').querySelector('svg.fig'); const a = s && s._anim; if (!a) return; a.playing = !a.playing; el.innerHTML = ic(a.playing ? 'pause' : 'play', 'sm'); },
  'anim-speed': el => { const s = el.closest('.stage').querySelector('svg.fig'); const a = s && s._anim; if (!a) return; a.speed = a.speed === 1 ? 0.5 : a.speed === 0.5 ? 0.25 : 1; el.textContent = (a.speed === 1 ? '1' : a.speed === 0.5 ? '0,5' : '0,25') + '×'; },
  'add-to-prog': el => addToProgModal(el.dataset.id),
  atp: el => {
    const ex = exById(el.dataset.ex); let p;
    if (el.dataset.id === '__new') { p = { id: uid(), name: 'Моя программа', desc: '', color: PROG_COLORS[DB.programs.length % PROG_COLORS.length], items: [] }; DB.programs.push(p); }
    else p = progById(el.dataset.id);
    p.items.push(it(ex.id, ex.d[0], ex.d[1], ex.d[2], ex.d[3])); save(); closeModal(); toast(`Добавлено в «${p.name}»`);
    if (el.dataset.id === '__new') go('#/program/' + p.id);
  },
  'custom-new': customModal,
  'custom-save': () => {
    const n = $('#cx-n').value.trim(); if (!n) { $('#cx-n').focus(); return; }
    const k = $('#cx-k').value;
    const d = k === 't' ? [3, 20, 40, 60] : k === 'c' ? [1, 10, 20, 60] : [3, 10, 12, 90];
    const ex = { id: 'c_' + uid(), custom: true, n, g: $('#cx-g').value, k, d, lvl: 1, eq: $('#cx-e').value.split(',').map(s => s.trim()).filter(Boolean), m: $('#cx-m').value.trim() || '—', steps: $('#cx-s').value.split('\n').map(s => s.trim()).filter(Boolean), err: [], tip: $('#cx-t').value.trim() };
    if (!ex.steps.length) ex.steps = ['Описание не добавлено.'];
    DB.custom.push(ex); resetExMap(); save(); closeModal(); go('#/ex/' + ex.id);
  },
  'custom-del': el => confirmBox('Удалить это упражнение? Оно пропадёт из программ, история останется.', 'Удалить', () => {
    const id = el.dataset.id; DB.custom = DB.custom.filter(e => e.id !== id); DB.programs.forEach(p => p.items = p.items.filter(i => i.ex !== id)); resetExMap(); save(); go('#/ex');
  }),
  // программы
  'prog-new': () => { const p = { id: uid(), name: 'Новая программа', desc: '', color: PROG_COLORS[DB.programs.length % PROG_COLORS.length], items: [] }; DB.programs.push(p); save(); go('#/program/' + p.id); },
  'prog-dup': el => { const p = JSON.parse(JSON.stringify(progById(el.dataset.id))); p.id = uid(); p.name += ' (копия)'; delete p.pair; delete p.builtin; DB.programs.push(p); save(); render(); toast('Копия создана'); },
  'prog-del': el => { const p = progById(el.dataset.id); confirmBox(`Удалить программу «${esc(p.name)}»? История тренировок сохранится.`, 'Удалить', () => { DB.programs = DB.programs.filter(x => x !== p); save(); render(); }); },
  'prog-color': el => { progById(parseRoute().arg).color = el.dataset.c; save(); render(); },
  'it-up': el => { const p = progById(parseRoute().arg), n = +el.dataset.n; [p.items[n - 1], p.items[n]] = [p.items[n], p.items[n - 1]]; save(); render(); },
  'it-down': el => { const p = progById(parseRoute().arg), n = +el.dataset.n; [p.items[n + 1], p.items[n]] = [p.items[n], p.items[n + 1]]; save(); render(); },
  'it-del': el => { const p = progById(parseRoute().arg); p.items.splice(+el.dataset.n, 1); save(); render(); },
  // выбор упражнений
  'pick-open': el => { UI.pick = { target: el.dataset.target, id: el.dataset.id, sel: new Set(), g: 'all', q: '' }; const pk = UI.pick; openModal(pickerHTML(), true); UI.pick = pk; },
  'pick-g': el => { UI.pick.g = el.dataset.g; refreshPicker(); },
  'pick-t': el => { const s = UI.pick.sel, id = el.dataset.id; s.has(id) ? s.delete(id) : s.add(id); el.classList.toggle('on'); const b = $('[data-act=pick-done]'); b.disabled = !s.size; b.textContent = 'Добавить' + (s.size ? ` (${s.size})` : ''); },
  'pick-done': () => {
    const pk = UI.pick, ids = [...pk.sel];
    if (pk.target === 'program') { const p = progById(pk.id); ids.forEach(id => { const ex = exById(id); p.items.push(it(id, ex.d[0], ex.d[1], ex.d[2], ex.d[3])); }); }
    else if (DB.active) { const a = DB.active; const first = a.items.length; ids.forEach(id => { const ex = exById(id); a.items.push(makeItem(ex, ex.d[0], ex.d[1], ex.d[2], ex.d[3])); }); a.cur = first; }
    save(); closeModal(); render(); toast(`Добавлено: ${ids.length}`);
  },
  // тренировка
  'wo-go': el => { const a = DB.active, n = +el.dataset.n; if (n < 0 || n >= a.items.length) return; a.cur = n; save(); render(); },
  'set-done': el => completeSet(+el.dataset.n),
  'set-add': () => { const it2 = curItem(), l = it2.sets[it2.sets.length - 1]; it2.sets.push({ w: l ? l.w : '', r: '', t: '', done: false }); save(); render(); },
  'set-rm': () => { const it2 = curItem(); if (it2.sets.length > 1) it2.sets.pop(); save(); render(); },
  'apply-w': el => { curItem().sets.forEach(s => { if (!s.done) s.w = +el.dataset.w; }); save(); render(); toast('Вес обновлён'); },
  sw: el => toggleSW(+el.dataset.n),
  'rest-start': () => startRest(curItem().rest, nextSetLabel()),
  'rest-add': el => { const r = DB.active.rest; r.end += +el.dataset.s * 1000; r.total = Math.max(r.total, (r.end - Date.now()) / 1000); if (r.end <= Date.now()) DB.active.rest = null; save(); renderDock(); },
  'rest-skip': () => { DB.active.rest = null; save(); renderDock(); },
  'wo-rm-ex': () => { const a = DB.active; confirmBox(`Убрать «${esc(exById(curItem().ex).n)}» из этой тренировки?`, 'Убрать', () => { a.items.splice(a.cur, 1); a.cur = clamp(a.cur, 0, Math.max(0, a.items.length - 1)); a.sw = null; save(); render(); }); },
  'wo-finish': () => { const a = DB.active, left = a.items.reduce((n, i) => n + i.sets.filter(s => !s.done).length, 0); if (left) confirmBox(`Осталось невыполненных подходов: ${left}. Завершить тренировку и сохранить выполненное?`, 'Завершить', finishWorkout, false); else finishWorkout(); },
  'wo-cancel': () => confirmBox('Отменить тренировку? Отмеченные подходы не сохранятся.', 'Отменить тренировку', () => { DB.active = null; save(); keepAwake(false); go('#/home'); }),
  // статистика
  sess: el => sessModal(el.dataset.id),
  'sess-del': el => confirmBox('Удалить эту тренировку из истории?', 'Удалить', () => { DB.sessions = DB.sessions.filter(s => s.id !== el.dataset.id); save(); render(); }),
  'stat-r': el => { UI.statRange = +el.dataset.r; render(); },
  'stat-m': el => { UI.statMetric = el.dataset.m; render(); },
  'stat-ex': el => { UI.statEx = el.dataset.id; UI.statMetric = 'w'; go('#/stats'); setTimeout(() => { const c = $('[data-chart=ex]'); c && c.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60); },
  demo: () => { makeDemo(); save(); render(); toast('Добавлены примерные тренировки за 8 недель'); },
  // настройки
  'set-theme': el => { DB.settings.theme = el.dataset.v; applyTheme(); save(); render(); },
  'set-tg': el => { const k = el.dataset.k; DB.settings[k] = !DB.settings[k]; save(); render(); },
  export: () => { const b = new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `gymapp-backup-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  import: () => $('#importFile').click(),
  'reset-progs': () => confirmBox('Вернуть готовые программы (А, Б, В, без тренажёров)? Твои программы останутся.', 'Вернуть', () => { const ids = new Set(DB.programs.map(p => p.id)); DEFAULT_PROGRAMS().forEach(p => { if (ids.has(p.id)) DB.programs[DB.programs.findIndex(x => x.id === p.id)] = p; else DB.programs.push(p); }); save(); render(); toast('Готово'); }, false),
  wipe: () => confirmBox('Удалить все тренировки, программы и настройки? Это нельзя отменить.', 'Удалить всё', () => { DB = freshDB(); resetExMap(); save(true); applyTheme(); go('#/home'); })
};
function refreshPicker() { const pk = UI.pick; const q = $('#pickq'); const pos = q && q.selectionStart; $('#modal-root .modal').innerHTML = pickerHTML(); UI.pick = pk; Anim.scan($('#modal-root')); const q2 = $('#pickq'); if (q2 && document.activeElement !== q2 && pos != null && pk.typing) { q2.focus(); q2.setSelectionRange(pos, pos); } }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault();
  if (el.dataset.act !== 'modal-bg') e.preventDefault();
  f(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'exq') { UI.exQ = t.value; $('#exgrid').innerHTML = exGrid(); Anim.scan($('#exgrid')); return; }
  if (t.id === 'pickq') { UI.pick.q = t.value; UI.pick.typing = true; const pk = UI.pick; const list = $('#picklist'); const tmp = document.createElement('div'); tmp.innerHTML = pickerHTML(); list.innerHTML = tmp.querySelector('#picklist').innerHTML; UI.pick = pk; Anim.scan(list); return; }
  if (t.dataset.pf) { const p = progById(parseRoute().arg); p[t.dataset.pf] = t.value; save(); return; }
  if (t.dataset.pi != null) { const p = progById(parseRoute().arg), i = p.items[+t.dataset.pi], k = t.dataset.k; i[k] = k === 'note' ? t.value : Math.max(0, parseInt(t.value) || 0); if (k === 'sets') i.sets = Math.max(1, i.sets); save(); return; }
  if (t.dataset.wi != null) { const s = DB.active.items[+t.dataset.wi].sets[+t.dataset.wj], k = t.dataset.k; const f = parseFloat(t.value.replace(',', '.')); if (k === 'm') s.t = isNaN(f) ? '' : Math.round(f * 60); else s[k] = isNaN(f) ? '' : f; save(); return; }
});
document.addEventListener('change', e => {
  const t = e.target, a = t.dataset.actChange;
  if (a === 'ex-eq') { UI.exE = t.value; render(); }
  if (a === 'stat-ex') { UI.statEx = t.value; render(); }
  if (t.dataset.pi != null || t.dataset.pf) render();
});
document.addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.actToggle === 'how') UI.howOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); if (e.key === 'Enter' && e.target.classList.contains('num')) e.target.blur(); });
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let clean;
    try { const d = JSON.parse(r.result); if (!d || !Array.isArray(d.programs) || !Array.isArray(d.sessions)) throw 0; clean = sanitizeDB(d); } catch (err) { toast('Не удалось прочитать файл'); return; }
    confirmBox(`Заменить текущие данные резервной копией? В ней ${clean.sessions.length} ${plural(clean.sessions.length, 'тренировка', 'тренировки', 'тренировок')} и ${clean.programs.length} ${plural(clean.programs.length, 'программа', 'программы', 'программ')}.`, 'Импортировать', () => { DB = clean; resetExMap(); save(true); applyTheme(); render(); toast('Данные импортированы'); }, false);
  };
  r.readAsText(f); e.target.value = '';
});

/* ---------- такт таймеров ---------- */
setInterval(() => {
  const a = DB.active; if (!a) return;
  const el = (n) => $$(`[data-el="${n}"]`);
  el('wo-time').forEach(x => x.textContent = fmtDur((Date.now() - a.start) / 1000));
  if (a.rest) {
    const left = (a.rest.end - Date.now()) / 1000;
    if (left <= 0) { a.rest = null; save(); beep(); renderDock(); toast('Отдых окончен — следующий подход!'); return; }
    const C = 2 * Math.PI * 24;
    el('rest').forEach(x => x.textContent = fmtDur(left));
    el('ring').forEach(x => x.setAttribute('stroke-dashoffset', C * (1 - clamp(left / a.rest.total, 0, 1))));
  }
  if (a.sw) {
    const t = (Date.now() - a.sw.start) / 1000;
    el('sw').forEach(x => x.textContent = fmtDur(t));
    if (!a.sw.beeped && t >= a.sw.target) { a.sw.beeped = true; beep([0, 0.25]); toast('Цель по времени достигнута!'); }
  }
}, 250);

/* ---------- демо-данные для статистики ---------- */
function makeDemo() {
  const now = Date.now(), base = { goblet_squat: 8, lat_pulldown: 25, pec_deck: 20, leg_curl: 20, db_press: 5, rdl_db: 8, db_row: 8, db_bench: 7, lunge_db: 4, reverse_fly: 10, machine_curl: 10, french_press: 5 };
  let k = 0;
  for (let w = 7; w >= 0; w--) for (const pid of ['pA', 'pB']) {
    const day = weekStart(now) - w * 7 * 864e5 + (pid === 'pA' ? 1 : 4) * 864e5 + 18.5 * 3600e3;
    if (day > now) continue;
    const p = progById(pid) || DEFAULT_PROGRAMS().find(x => x.id === pid);
    const items = p.items.map(i => {
      const ex = exById(i.ex); const prog = Math.floor((7 - w) / 2);
      const sets = Array.from({ length: i.sets }, (_, j) => {
        if (ex.k === 'c') return { t: i.max * 60 };
        if (ex.k === 't') return { t: Math.min(60, i.min + (7 - w) * 4 - j * 3) };
        if (ex.k === 'r') return { r: Math.min(i.max, i.min + (7 - w) % 4 - j) };
        const w0 = (base[i.ex] || 10) + prog * weightStep(ex);
        return { w: w0, r: Math.max(i.min - 1, i.max - j - ((7 - w) % 2)) };
      });
      return { ex: i.ex, sets };
    });
    const start = day + (k++ % 3) * 600e3;
    DB.sessions.push({ id: 'demo' + uid(), programId: pid, name: p.name, start, end: start + (52 + (k % 4) * 5) * 60e3, items });
  }
}


/* =====================================================================
   6. УСТАНОВКА И ОФЛАЙН (PWA), особенности iOS
   ===================================================================== */
const IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_STANDALONE = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IS_WEB = /^https?:$/.test(location.protocol);
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (['home', 'settings'].includes(parseRoute().name)) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Приложение установлено'); render(); });

function canInstall() { return IS_WEB && !IS_STANDALONE(); }
function installBanner() {
  if (!canInstall() || DB.settings.hideInstall) return '';
  return `<div class="install"><img src="icons/icon-192.png" alt=""><div style="flex:1;min-width:0"><div style="font-weight:800">Установи на телефон</div><div class="muted" style="font-size:13px">Работает без интернета</div></div>
    <button class="btn primary sm" data-act="install">Установить</button><button class="btn ghost icon-only sm" data-act="install-hide" title="Скрыть">${ic('x', 'sm')}</button></div>`;
}
function installCard() {
  let state;
  if (!IS_WEB) state = `<p class="muted" style="margin-top:0;font-size:14px">Сейчас приложение открыто как файл. Чтобы установить его и пользоваться без интернета, открой его по ссылке на сайт (например, GitHub Pages) в Safari или Chrome.</p>`;
  else if (IS_STANDALONE()) state = `<div class="tip">${ic('check')}<div><b>Приложение установлено.</b> Оно работает без интернета, данные хранятся на этом устройстве.</div></div>`;
  else state = `<p class="muted" style="margin-top:0;font-size:14px">Добавь приложение на экран «Домой»: оно откроется на весь экран и будет работать без интернета.</p><button class="btn primary" data-act="install">${ic('download')} Установить</button>`;
  const off = IS_WEB && 'serviceWorker' in navigator ? `<div class="faint mt" style="font-size:12.5px" id="offState">${navigator.serviceWorker.controller ? '✓ Сохранено для работы офлайн' : 'Сохраняю для работы офлайн…'}</div>` : '';
  return `<div class="card"><div class="card-h"><h3>${ic('download')} Приложение на телефоне</h3></div>${state}${off}</div>`;
}
function installModal() {
  if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); return; }
  const shareIc = `<span class="ios-share"><svg class="icon sm" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/></svg></span>`;
  const body = IS_IOS ? `<ol class="ios-steps">
      <li><span>Открой эту страницу в <b>Safari</b> (в других браузерах на iPhone пункта может не быть).</span></li>
      <li><span>Нажми кнопку «Поделиться» ${shareIc} внизу экрана.</span></li>
      <li><span>Пролистай меню и выбери <b>«На экран „Домой“»</b>.</span></li>
      <li><span>Нажми <b>«Добавить»</b> — на экране появится иконка GymApp.</span></li></ol>
      <div class="tip mt">${ic('info')}<div>Установленное приложение хранит данные отдельно от Safari. Если ты уже тренировался в браузере — сделай <b>Экспорт</b> в настройках и <b>Импорт</b> в установленном приложении.</div></div>`
    : `<ol class="ios-steps"><li><span>Открой меню браузера <b>⋮</b> (в Chrome — справа вверху).</span></li><li><span>Выбери <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>.</span></li><li><span>Подтверди установку — иконка GymApp появится на рабочем столе.</span></li></ol>`;
  openModal(`${mHead('Установка на телефон')}<div class="modal-b">${body}</div><div class="modal-f"><button class="btn primary" data-act="close">Понятно</button></div>`);
}
ACT.install = installModal;
ACT['install-hide'] = () => { DB.settings.hideInstall = true; save(); render(); };

// iOS: звук разрешён только после касания — «разблокируем» аудио на первом же тапе
function unlockAudio() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const b = AC.createBuffer(1, 1, 22050), s = AC.createBufferSource(); s.buffer = b; s.connect(AC.destination); s.start(0);
  } catch (e) { }
}
document.addEventListener('pointerdown', unlockAudio, { once: true, capture: true });
document.addEventListener('touchend', unlockAudio, { once: true, capture: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && AC && AC.state !== 'running') AC.resume().catch(() => { }); });

function registerSW() {
  if (!IS_WEB || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
    const el = $('#offState'); if (el) el.textContent = '✓ Сохранено для работы офлайн';
  }).catch(e => console.warn('SW', e));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
}

/* ---------- запуск ---------- */
load();
applyTheme();
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change', () => { if (DB.settings.theme === 'auto') { applyTheme(); render(); } });
if (DB.active) keepAwake(true);
render();
registerSW();

</script>
